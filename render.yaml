services:
  - type: web
    name: safedocs
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_DWS
        value: "false"          # set to "true" and add the keys below to go live
      - key: DWS_API_KEY
        sync: false             # paste in the Render dashboard (kept secret)
      - key: DWS_EXTRACT_API_KEY
        sync: false
